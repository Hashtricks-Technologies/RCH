services:
  postgres:
    image: postgres:17
    container_name: rch-postgres
    environment:
      POSTGRES_USER: rch
      POSTGRES_PASSWORD: rch
      POSTGRES_DB: rch
    ports: ["5439:5432"]
    volumes:
      - rch-pg:/var/lib/postgresql/data
      - ./scripts/pg-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rch -d rch"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  rch-pg: {}
