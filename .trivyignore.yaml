# Trivy ignore list for the container-image scans in CI (.github/workflows/ci.yml) and for the
# images about to be deployed (.github/workflows/deploy.yml). Every entry needs a reason and an
# expiry; the scan fails again the day one lapses.
#
# YAML, not the one-line-per-id .trivyignore this replaced: that file's `CVE-… exp:2026-09-30`
# was invented syntax. Trivy's plain-text format has no expiry field at all - it parses the id
# and ignores the rest of the line - so the expiry that was supposed to bring the exception
# back for review was never going to fire. `expired_at` below is real, and Trivy starts
# reporting the CVE again on that date.
#
# Empty. The api and audit images moved to gcr.io/distroless/nodejs24-debian13:nonroot (Debian
# 13.7, OpenSSL 3.5.7) on 2026-11-12, when the six libssl3 exceptions for the Debian 12 base had
# lapsed with distroless still shipping 3.0.18-1~deb12u2. The Debian 13 base scans with no fixable
# HIGH or CRITICAL finding (`trivy image --ignore-unfixed --severity CRITICAL,HIGH`), so nothing is
# accepted here. A new entry still needs a `statement` and a real `expired_at`.
vulnerabilities: []
