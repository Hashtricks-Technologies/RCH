name: CI
on:
  push: { branches: [develop, staging, production] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: rch, POSTGRES_PASSWORD: rch, POSTGRES_DB: rch_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rch" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://rch:rch@localhost:5432/rch_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck test
      # Not a turbo task: `pnpm lint` is oxlint per package plus knip, and knip is
      # repo-wide, so turbo never runs it. Keep it as its own step.
      - run: pnpm lint
      # `pnpm lint` already runs this (spec §5.1's boundaries oxlint cannot see: protected
      # tables, the ledger's one door, module skeletons); a separate named step just makes a
      # boundary failure obvious in the CI log instead of buried at the end of `pnpm lint`.
      - name: Check module and boundary rules (spec §5.1)
        run: pnpm check:boundaries
      - name: pnpm audit (high and critical)
        # The registry's audit endpoint times out now and then. A network failure is a
        # retry and, at worst, a warning; an advisory is a failure — the two must never be
        # confused, or a flaky endpoint would either block every merge or hide a real CVE.
        # Each attempt is capped at two minutes: pnpm's own retries once stretched one
        # attempt to four, and a slow registry held the whole job for a quarter of an hour.
        run: |
          for attempt in 1 2 3; do
            set +e; out=$(timeout 120 pnpm audit --audit-level=high 2>&1); rc=$?; set -e
            if [ "$rc" -eq 0 ]; then echo "$out"; exit 0; fi
            # 124 is timeout(1)'s own exit: the attempt was killed, not answered.
            if [ "$rc" -eq 124 ] || [ -z "$out" ] || echo "$out" | grep -qE 'ERR_SOCKET_TIMEOUT|FetchError|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN'; then
              echo "audit endpoint unreachable (attempt $attempt, rc=$rc)"; sleep 10; continue
            fi
            echo "$out"; echo "::error::pnpm audit reports high or critical advisories"; exit 1
          done
          echo "::warning::pnpm audit skipped: registry unreachable after 3 attempts"
      - name: Build the site
        run: bash scripts/build-site.sh
      - uses: actions/upload-artifact@v7
        with: { name: site, path: dist, retention-days: 7 }
  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: check
    # Build + scan normally finish well inside this, but the kind install at the end of
    # this job (a real `helm install`/`helm upgrade` — see the last few steps) budgets 15m
    # of its own on top of that. Raised from 20 to 30 when the Playwright smoke joined the
    # install: downloading the browser is two to three minutes, and eight scenarios against a
    # kind cluster are another three or four on top of the install that was already there.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build api
        uses: docker/build-push-action@v6
        # load: true (both here and for ui below) puts the image into the local Docker
        # daemon so Trivy and `kind load docker-image` can see it — that requires a single
        # platform, hence pinning it rather than leaving it to buildx's default.
        with: { context: ., file: apps/api/Dockerfile, push: false, load: true, platforms: linux/amd64, tags: rch-api:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build ui
        uses: docker/build-push-action@v6
        with: { context: ., file: UI/Dockerfile, push: false, load: true, platforms: linux/amd64, tags: rch-ui:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Scan api
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: rch-api:ci, severity: CRITICAL, exit-code: "1", ignore-unfixed: true, trivyignores: .trivyignore }
      - name: Scan ui
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: rch-ui:ci, severity: CRITICAL, exit-code: "1", ignore-unfixed: true, trivyignores: .trivyignore }
      # From here on: a real `helm install` against a throwaway kind cluster (spec §16,
      # §14 Phase 1 exit amendment). Lives at the end of this job, not a separate one that
      # `needs: images`, because the images above are only in this runner's local Docker
      # daemon (load: true) — a second job would have to rebuild or re-push/pull them.
      - uses: azure/setup-helm@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with: { cluster_name: rch }
      - name: Load images into kind
        run: kind load docker-image rch-api:ci rch-ui:ci --name rch
      - name: Generate a throwaway JWT signing key
        # openssl, not `pnpm --filter @rch/api keys:generate` — the pnpm/Node setup below
        # exists only for the smoke, and keying off openssl keeps this step independent of
        # it and of an install succeeding. Masked because it's still a private key, even
        # though the cluster it signs tokens in is deleted at the end of this job.
        run: |
          openssl genpkey -algorithm ed25519 -out /tmp/jwt-priv.pem
          openssl pkey -in /tmp/jwt-priv.pem -pubout -out /tmp/jwt-pub.pem
          PRIV_B64=$(base64 -w0 /tmp/jwt-priv.pem)
          PUB_B64=$(base64 -w0 /tmp/jwt-pub.pem)
          rm -f /tmp/jwt-priv.pem /tmp/jwt-pub.pem
          echo "::add-mask::$PRIV_B64"
          echo "::add-mask::$PUB_B64"
          { echo "JWT_PRIVATE_KEY=$PRIV_B64"; echo "JWT_PUBLIC_KEY=$PUB_B64"; } >> "$GITHUB_ENV"
      # The Node setup this job has deliberately not needed until now: the smoke at the end of
      # install-test.sh is `pnpm test:e2e`, which needs the workspace installed and a browser.
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Cache the browser the smoke drives
        # The store path Playwright downloads into, keyed by the lockfile that pins the
        # resolved version — a browser is ~150 MB and never changes between runs of one.
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @rch/e2e exec playwright install --with-deps chromium
      # A cache hit still needs the system libraries the browser links against.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @rch/e2e exec playwright install-deps chromium
      - name: helm install into kind
        # Two of the smoke's assertions are gated on a change that has not landed yet and would
        # otherwise pass vacuously — add E2E_OTP_REDACTED and E2E_SUPPORT_SERVER here, set to
        # "1", in the commit that lands each. e2e/README.md's "Known switches" has both.
        env: { E2E: "1" }
        run: deploy/chart/rch/ci/install-test.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }
  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: deploy/chart/rch/tests/render.test.sh
