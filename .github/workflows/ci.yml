name: CI
on:
  push: { branches: [develop, staging, production] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    # Every step here is minutes, not tens of minutes; the whole job has never come near this.
    # A run that does is hung - a postgres service that never became healthy, a registry that
    # accepts the connection and then says nothing - and without a cap it holds a runner (and,
    # now that deploy.yml waits on this workflow, the deploy behind it) for the six-hour default.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: rch, POSTGRES_PASSWORD: rch, POSTGRES_DB: rch_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rch" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://rch:rch@localhost:5432/rch_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck test
      # Not a turbo task: `pnpm lint` is oxlint per package plus knip, and knip is
      # repo-wide, so turbo never runs it. Keep it as its own step.
      - run: pnpm lint
      # `pnpm lint` already runs this (the boundaries oxlint cannot see: protected tables, the
      # ledger's one door, module skeletons); a separate named step just makes a
      # boundary failure obvious in the CI log instead of buried at the end of `pnpm lint`.
      - name: Check module and boundary rules
        run: pnpm check:boundaries
      - name: pnpm audit (high and critical)
        # The registry's audit endpoint times out now and then, so a network failure is a
        # retry, not a verdict - an advisory is a failure and the two must never be confused.
        # But three unreachable attempts is not "no advisories", it is "we did not look", and
        # this used to pass the job with a ::warning:: nobody reads. It now fails: a dependency
        # gate that can be skipped by an endpoint being slow is not a gate. Re-run the job.
        # Each attempt is capped at two minutes: pnpm's own retries once stretched one
        # attempt to four, and a slow registry held the whole job for a quarter of an hour.
        run: |
          for attempt in 1 2 3; do
            set +e; out=$(timeout 120 pnpm audit --audit-level=high 2>&1); rc=$?; set -e
            if [ "$rc" -eq 0 ]; then echo "$out"; exit 0; fi
            # 124 is timeout(1)'s own exit: the attempt was killed, not answered.
            if [ "$rc" -eq 124 ] || [ -z "$out" ] || echo "$out" | grep -qE 'ERR_SOCKET_TIMEOUT|FetchError|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN'; then
              echo "audit endpoint unreachable (attempt $attempt, rc=$rc)"; sleep 10; continue
            fi
            echo "$out"; echo "::error::pnpm audit reports high or critical advisories"; exit 1
          done
          echo "::error::pnpm audit could not be run: the registry was unreachable on all 3 attempts"
          exit 1
      - name: Build the UI
        # The images job builds it again inside UI/Dockerfile; this is the same build failing
        # in the first job with the compiler's own output, rather than inside a docker layer.
        run: pnpm --filter @rch/ui build
  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: check
    # Build + scan normally finish well inside this, but the kind install at the end of
    # this job (a real `helm install`/`helm upgrade` - see the last few steps) budgets 15m
    # of its own on top of that.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build api
        uses: docker/build-push-action@v6
        # load: true (both here and for ui below) puts the image into the local Docker
        # daemon so Trivy and `kind load docker-image` can see it - that requires a single
        # platform, hence pinning it rather than leaving it to buildx's default.
        with: { context: ., file: apps/api/Dockerfile, push: false, load: true, platforms: linux/amd64, tags: rch-api:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build ui
        uses: docker/build-push-action@v6
        with: { context: ., file: UI/Dockerfile, push: false, load: true, platforms: linux/amd64, tags: rch-ui:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      # HIGH as well as CRITICAL: a hospital till and its store ledger are not a place to wait
      # for a HIGH to be re-rated before acting on it, and ignore-unfixed already keeps the gate
      # to things there is a patch for. An accepted finding goes in .trivyignore.yaml with a
      # reason and an expiry, so the exception is reviewed rather than forgotten.
      - name: Scan api
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: rch-api:ci, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true, trivyignores: .trivyignore.yaml }
      - name: Scan ui
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: rch-ui:ci, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true, trivyignores: .trivyignore.yaml }
      # From here on: a real `helm install` against a throwaway kind cluster. Lives at the
      # end of this job, not a separate one that
      # `needs: images`, because the images above are only in this runner's local Docker
      # daemon (load: true) - a second job would have to rebuild or re-push/pull them.
      - uses: azure/setup-helm@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with: { cluster_name: rch }
      - name: Load images into kind
        run: kind load docker-image rch-api:ci rch-ui:ci --name rch
      - name: Generate a throwaway JWT signing key
        # openssl, not `pnpm --filter @rch/api keys:generate` - this job has no Node toolchain
        # and needs none just to mint a key. Masked because it's still a private key, even
        # though the cluster it signs tokens in is deleted at the end of this job.
        run: |
          openssl genpkey -algorithm ed25519 -out /tmp/jwt-priv.pem
          openssl pkey -in /tmp/jwt-priv.pem -pubout -out /tmp/jwt-pub.pem
          PRIV_B64=$(base64 -w0 /tmp/jwt-priv.pem)
          PUB_B64=$(base64 -w0 /tmp/jwt-pub.pem)
          rm -f /tmp/jwt-priv.pem /tmp/jwt-pub.pem
          echo "::add-mask::$PRIV_B64"
          echo "::add-mask::$PUB_B64"
          { echo "JWT_PRIVATE_KEY=$PRIV_B64"; echo "JWT_PUBLIC_KEY=$PUB_B64"; } >> "$GITHUB_ENV"
      - name: helm install into kind
        # SEED_PASSWORD is the password the seed writes onto its accounts and the one
        # install-test.sh's login check signs in with. It is not a secret - the cluster is
        # deleted at the end of the job - but config.ts has no default for it any more, so it
        # has to be named somewhere.
        env: { SEED_PASSWORD: ci-seed-password-1 }
        run: deploy/chart/rch/ci/install-test.sh
  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    # A helm template render and a handful of greps. Anything past ten minutes is stuck.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: deploy/chart/rch/tests/render.test.sh
