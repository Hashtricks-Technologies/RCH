name: CI

on:
  push:
    branches: [develop, staging, production]
  pull_request:

# A second push to the same branch makes the first run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, test
        run: pnpm turbo typecheck lint test

      # Runs the same script Netlify does, so a broken assembly fails here first.
      - name: Build the site
        run: bash scripts/build-site.sh

      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7
