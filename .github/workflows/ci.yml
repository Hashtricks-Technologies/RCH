name: CI

on:
  push:
    branches: [develop, staging, production]
  pull_request:

# A second push to the same branch makes the first run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vite 8 requires ^22.22.2 || ^24.15.0 || >=26.
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm test

      # Runs the same script Netlify does, so a broken assembly fails here first.
      - name: Build the site
        run: bash scripts/build-site.sh

      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7
