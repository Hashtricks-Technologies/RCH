name: Deploy
on:
  push: { branches: [staging, production] }
permissions: { id-token: write, contents: read }
concurrency: { group: "deploy-${{ github.ref }}", cancel-in-progress: false }
jobs:
  guard:
    name: Fast-forward guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: staging must be an ancestor of develop; production of staging
        run: |
          set -e
          if [ "${GITHUB_REF_NAME}" = staging ]; then git merge-base --is-ancestor HEAD origin/develop; fi
          if [ "${GITHUB_REF_NAME}" = production ]; then git merge-base --is-ancestor HEAD origin/staging; fi
  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: guard
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: write }
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    env:
      NS: ${{ github.ref_name == 'production' && 'rch' || 'rch-staging' }}
      VALUES: ${{ github.ref_name == 'production' && 'values-prod.yaml' || 'values-staging.yaml' }}
      CLUSTER: ${{ github.ref_name == 'production' && secrets.EKS_CLUSTER_PROD || secrets.EKS_CLUSTER_STAGING }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_ROLE_ARN }}", aws-region: "${{ secrets.AWS_REGION }}" }
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/api/Dockerfile, push: true, platforms: linux/amd64, tags: "${{ secrets.ECR_REGISTRY }}/rch-api:${{ github.sha }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: UI/Dockerfile, push: true, platforms: linux/amd64, tags: "${{ secrets.ECR_REGISTRY }}/rch-ui:${{ github.sha }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: azure/setup-helm@v4
      - run: aws eks update-kubeconfig --name "$CLUSTER" --region "${{ secrets.AWS_REGION }}"
      - name: helm upgrade
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          # Secrets are passed through env: and read from quoted shell
          # variables, never interpolated into the command text — GitHub
          # substitutes its double-brace expressions textually before bash runs, which
          # would otherwise be a shell-injection vector (a secret containing
          # `;`, `$(...)` or quotes) and would land the PEM contents in argv.
          # --set-string (not --set) so Helm's strvals parser doesn't choke
          # on commas/`=` inside the values, and EXTRA is a bash array, not
          # a string, so no further word-splitting or re-quoting happens.
          EXTRA=()
          if [ "${{ github.ref_name }}" = staging ]; then
            EXTRA=(
              --set-string "secrets.values.DATABASE_URL=$DATABASE_URL"
              --set-string "secrets.values.JWT_PRIVATE_KEY=$JWT_PRIVATE_KEY"
              --set-string "secrets.values.JWT_PUBLIC_KEY=$JWT_PUBLIC_KEY"
            )
          fi
          # --atomic rolls the release back to its previous state if this upgrade fails, instead
          # of leaving it stuck in `pending-upgrade` (the state --wait alone can leave behind).
          # On a first install --atomic instead DELETES the release on failure, which is the
          # wanted behaviour there too — nothing half-applied survives a failed first deploy.
          # --timeout is 15m, not --wait's old 10m: the migrate initContainer runs before the api
          # container becomes Ready, and a large migration is not a fast one.
          helm upgrade --install rch deploy/chart/rch -n "$NS" --create-namespace -f "deploy/chart/rch/$VALUES" \
            --set image.registry="${{ secrets.ECR_REGISTRY }}" --set image.tag="${{ github.sha }}" "${EXTRA[@]}" --wait --atomic --timeout 15m
      - name: Prove it came up
        run: |
          kubectl -n "$NS" rollout status deploy/rch-api --timeout=5m
          kubectl -n "$NS" rollout status deploy/rch-ui --timeout=5m
          # /readyz checks the database and that the applied migration count matches the journal,
          # so a green here is a stronger statement than "the pod started".
          kubectl -n "$NS" run rch-smoke-$RANDOM --rm -i --restart=Never --image=curlimages/curl:8.11.1 -- \
            curl -fsS --retry 10 --retry-connrefused http://rch-api:3000/readyz
      - name: Tag production
        if: github.ref_name == 'production' && success()
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"; git tag "$TAG" && git push origin "$TAG"
  skipped:
    name: Deploy skipped (DEPLOY_ENABLED is not true)
    needs: guard
    if: ${{ vars.DEPLOY_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Set repository variable DEPLOY_ENABLED=true and the AWS secrets to enable deploys. See deploy/RUNBOOK.md."
