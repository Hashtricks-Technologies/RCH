name: Deploy
# Deploys run only after CI has gone green on the very commit being deployed. The old
# `on: push` fired this workflow alongside ci.yml, so a red typecheck, a failed test or a
# CRITICAL in an image could reach a cluster while CI was still running - the two were
# racing, not ordered. `workflow_run` inverts that: GitHub starts this only when the named
# workflow finishes, and `head_sha`/`head_branch` below name the commit and branch it
# finished on. Everything here is pinned to those two values; `github.sha` and
# `github.ref_name` are NOT usable in a workflow_run event (they point at the default
# branch's tip, not at what CI just passed).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop, staging, production]
permissions: { id-token: write, contents: read }
concurrency: { group: "deploy-${{ github.event.workflow_run.head_branch }}", cancel-in-progress: false }
jobs:
  guard:
    name: Fast-forward guard
    # `event == 'push'` as well as the green conclusion: the branches filter above matches the
    # CI run's HEAD branch, so a pull request raised FROM staging INTO production (the hotfix
    # flow in CLAUDE.md) would otherwise satisfy it and deploy an unmerged PR head.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      REF_NAME: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v7
        # fetch-depth: 0 for the merge-base below - it needs origin/develop and origin/staging,
        # which a shallow checkout of one commit does not have.
        with: { ref: "${{ github.event.workflow_run.head_sha }}", fetch-depth: 0 }
      - name: staging must be an ancestor of develop; production of staging
        run: |
          set -e
          if [ "$REF_NAME" = staging ]; then git merge-base --is-ancestor HEAD origin/develop; fi
          if [ "$REF_NAME" = production ]; then git merge-base --is-ancestor HEAD origin/staging; fi
  deploy:
    name: Deploy ${{ github.event.workflow_run.head_branch }}
    needs: guard
    # Repeats guard's own `event == 'push'` clause: `needs: guard` only skips this job when
    # guard's *result* is failure/cancelled, not when guard is itself skipped by its `if:` -
    # a workflow_run event guard's `if:` refuses is a skip, and a skipped dependency still lets
    # a dependent job run. Without this clause here too, a PR-triggered CI run (staging into
    # production, the hotfix flow) would reach this job and deploy an unmerged PR head.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Two image builds, a 15m helm timeout and two rollouts. A job that runs past this is stuck,
    # not slow, and holding the concurrency group open costs the next push its deploy.
    timeout-minutes: 45
    permissions: { id-token: write, contents: write }
    environment: ${{ github.event.workflow_run.head_branch == 'production' && 'production' || github.event.workflow_run.head_branch == 'staging' && 'staging' || 'dev' }}
    env:
      REF_NAME: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE: rch
      NS: ${{ github.event.workflow_run.head_branch == 'production' && 'rch' || github.event.workflow_run.head_branch == 'staging' && 'rch-staging' || 'rch-dev' }}
      VALUES: ${{ github.event.workflow_run.head_branch == 'production' && 'values-prod.yaml' || github.event.workflow_run.head_branch == 'staging' && 'values-staging.yaml' || 'values-dev.yaml' }}
      CLUSTER: ${{ github.event.workflow_run.head_branch == 'production' && secrets.EKS_CLUSTER_PROD || github.event.workflow_run.head_branch == 'staging' && secrets.EKS_CLUSTER_STAGING || secrets.EKS_CLUSTER_DEV }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_ROLE_ARN }}", aws-region: "${{ secrets.AWS_REGION }}" }
      - uses: aws-actions/amazon-ecr-login@v2
      # The repositories refuse to overwrite a tag (immutable tags), so a re-run of a
      # commit whose images were already pushed skips the builds instead of failing on the push.
      - name: images already pushed for this commit?
        id: images
        run: |
          have=true
          for repo in rch-api rch-ui; do
            aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$SHA" > /dev/null 2>&1 || have=false
          done
          echo "exists=$have" >> "$GITHUB_OUTPUT"
          echo "images for $SHA already in ECR: $have"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        if: steps.images.outputs.exists != 'true'
        with: { context: ., file: apps/api/Dockerfile, push: true, platforms: linux/amd64, tags: "${{ secrets.ECR_REGISTRY }}/rch-api:${{ github.event.workflow_run.head_sha }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        if: steps.images.outputs.exists != 'true'
        with: { context: ., file: UI/Dockerfile, push: true, platforms: linux/amd64, tags: "${{ secrets.ECR_REGISTRY }}/rch-ui:${{ github.event.workflow_run.head_sha }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      # ci.yml scans rch-api:ci / rch-ui:ci - the images it built itself, which are not the
      # bytes that reach a cluster. These two steps scan the exact tags helm is about to
      # deploy, pulled back out of ECR (the ecr-login above left the credentials trivy needs),
      # and they run whether the builds above ran or were skipped as already-pushed. Same
      # action version and ignore file as ci.yml, so the two scans cannot drift apart.
      - name: Scan the api image that is about to be deployed
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ secrets.ECR_REGISTRY }}/rch-api:${{ github.event.workflow_run.head_sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
      - name: Scan the ui image that is about to be deployed
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ secrets.ECR_REGISTRY }}/rch-ui:${{ github.event.workflow_run.head_sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
      - uses: azure/setup-helm@v4
      - run: aws eks update-kubeconfig --name "$CLUSTER" --region "${{ secrets.AWS_REGION }}"
      # dev and staging pass their four secrets to helm from the GitHub environment. An unset
      # one is not an error helm reports: --set-string writes the empty string into the
      # Secret, the api container fails config validation minutes later, and the log says
      # nothing about where the blank came from. Refuse here, by name, before anything moves.
      # production is exempt: it reads these four plus JWT_PREVIOUS_PUBLIC_KEY from AWS
      # Secrets Manager through the External Secrets Operator (values-prod.yaml), so these
      # GitHub secrets are empty there on purpose - and production therefore gets NO pre-flight
      # here. RUNBOOK §11's ExternalSecret bullet carries the manual `jq -e` check instead.
      - name: Every secret the chart needs is present
        if: github.event.workflow_run.head_branch != 'production'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: |
          missing=0
          for v in DATABASE_URL JWT_PRIVATE_KEY JWT_PUBLIC_KEY SEED_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; missing=1; }
          done
          [ "$missing" = 0 ] || { echo "set the missing secrets on the $REF_NAME environment - see deploy/RUNBOOK.md"; exit 1; }
      - name: helm upgrade
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: |
          # Secrets are passed through env: and read from quoted shell
          # variables, never interpolated into the command text - GitHub
          # substitutes its double-brace expressions textually before bash runs, which
          # would otherwise be a shell-injection vector (a secret containing
          # `;`, `$(...)` or quotes) and would land the PEM contents in argv.
          # --set-string (not --set) so Helm's strvals parser doesn't choke
          # on commas/`=` inside the values, and EXTRA is a bash array, not
          # a string, so no further word-splitting or re-quoting happens.
          EXTRA=()
          # dev and staging read their secrets from the GitHub environment; production from
          # AWS Secrets Manager through the External Secrets Operator (values-prod.yaml), whose
          # remote JSON must carry SEED_PASSWORD too.
          #
          # SEED_PASSWORD has no default in apps/api/src/config.ts, so the api container will not
          # start without one. It is the password the six seeded accounts start on and is only
          # read by the seed CLI, but every container carries it because rch.envList builds one
          # env list for all of them. The step above refuses an empty one before we get here.
          if [ "$REF_NAME" != production ]; then
            EXTRA=(
              --set-string "secrets.values.DATABASE_URL=$DATABASE_URL"
              --set-string "secrets.values.JWT_PRIVATE_KEY=$JWT_PRIVATE_KEY"
              --set-string "secrets.values.JWT_PUBLIC_KEY=$JWT_PUBLIC_KEY"
              --set-string "secrets.values.SEED_PASSWORD=$SEED_PASSWORD"
            )
          fi
          # dev and staging keep --atomic: they are rebuildable, nobody is mid-shift on them,
          # and an automatic undo is worth more there than the wreckage of the failed attempt.
          #
          # production takes --wait alone, deliberately. --atomic deletes the failed release's
          # pods the instant it gives up, which takes with it the only two things RUNBOOK §3
          # tells the operator to read - the pod events and the migrate initContainer's log -
          # and leaves "the rollout failed" with no way to learn why. Worse, a migration that
          # already committed is not undone by rolling the Deployment back: --atomic would put
          # the previous image in front of a schema it was never written for, which is a
          # second, quieter outage on top of the first. So on production a failure stops, keeps
          # the evidence (the step below prints it), and waits for a person to decide whether
          # the right move is forward or back.
          #
          # --timeout is 15m, not --wait's old 10m: the migrate initContainer runs before the api
          # container becomes Ready, and a large migration is not a fast one.
          ATOMIC=(--atomic)
          if [ "$REF_NAME" = production ]; then ATOMIC=(); fi
          helm upgrade --install "$RELEASE" deploy/chart/rch -n "$NS" --create-namespace -f "deploy/chart/rch/$VALUES" \
            --set image.registry="${{ secrets.ECR_REGISTRY }}" --set image.tag="$SHA" "${EXTRA[@]}" --wait "${ATOMIC[@]}" --timeout 15m
      # Runs on every branch, before any rollback, so the evidence is in the job log whatever
      # happens next. `|| true` throughout: a first install that never created a pod has no
      # events and no logs, and this step must not turn that into a second failure.
      - name: What the cluster saw
        if: failure()
        run: |
          # Two commands, not one. `get pods,events --sort-by=.lastTimestamp` sorts BOTH kinds by
          # a field only Events have, so every Pod row sorts as if its timestamp were empty - and
          # then `| tail -80` cut the pod list off the top of the output, which is the half that
          # says *why* (ImagePullBackOff, Init:CrashLoopBackOff, Pending with no node). The pods
          # are listed whole and wide; only the events are tailed.
          kubectl -n "$NS" get pods -o wide || true
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -80 || true
          kubectl -n "$NS" logs -l app.kubernetes.io/component=api -c migrate --tail=200 || true
      # Only dev and staging, and only when the release is genuinely stuck. --atomic has
      # normally already rolled these back by now, and `helm rollback` with no revision goes
      # back exactly one - running it after a successful atomic undo would re-apply the failed
      # revision. So: act only on a pending-* or failed status, which is what is left when
      # --atomic itself could not finish (the job timed out mid-upgrade, or the rollback hit
      # the same wall the upgrade did).
      - name: Unstick the release
        if: failure() && github.event.workflow_run.head_branch != 'production'
        run: |
          # A release helm cannot find prints nothing at all, and jq turns nothing into
          # nothing rather than into an error - hence the two defaults below rather than a
          # `|| echo`, which would never fire.
          status="$(helm status "$RELEASE" -n "$NS" -o json 2>/dev/null | jq -r '.info.status' 2>/dev/null)"
          revisions="$(helm history "$RELEASE" -n "$NS" -o json 2>/dev/null | jq 'length' 2>/dev/null)"
          [ -n "$status" ] || status=none
          case "$revisions" in ''|*[!0-9]*) revisions=0 ;; esac
          echo "release $RELEASE in $NS is '$status' across $revisions revision(s)"
          case "$status" in
            pending-upgrade|pending-install|pending-rollback|failed)
              if [ "$revisions" -ge 2 ]; then
                helm rollback "$RELEASE" -n "$NS" --wait --timeout 10m
              else
                echo "no earlier revision to roll back to; leaving it for a person"
              fi ;;
            *) echo "nothing to roll back" ;;
          esac
      - name: Prove it came up
        run: |
          kubectl -n "$NS" rollout status deploy/rch-api --timeout=5m
          kubectl -n "$NS" rollout status deploy/rch-ui --timeout=5m
          # Availability is the readiness probe's own verdict, read from the cluster: the api's
          # probe is GET /readyz, which checks the database and that the applied migration count
          # matches the journal, so an Available deployment is the same statement the old smoke
          # pod made - without pulling an image from Docker Hub into the cluster to make it, and
          # without a rate limit or an outage there being able to fail a good deploy.
          kubectl -n "$NS" wait --for=condition=Available deploy/rch-api --timeout=300s
          kubectl -n "$NS" wait --for=condition=Available deploy/rch-ui --timeout=300s
      - name: Tag production
        if: github.event.workflow_run.head_branch == 'production' && success()
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"; git tag "$TAG" && git push origin "$TAG"
  skipped:
    name: Deploy skipped (DEPLOY_ENABLED is not true)
    needs: guard
    # Same `event == 'push'` repeat as the deploy job above, and for the same reason.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.DEPLOY_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Set repository variable DEPLOY_ENABLED=true and the AWS secrets to enable deploys. See deploy/RUNBOOK.md."
