<title>Royal Care Counters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#F4F6F5; --surface:#FFFFFF; --surface-2:#EDF1EF; --surface-3:#E4EAE8;
  --line:#D7DFDC; --line-strong:#B7C4C0;
  --ink:#141F1D; --ink-2:#42524E; --ink-3:#6E807B;
  --accent:#0E5C55; --accent-soft:#DCEBE8; --on-accent:#FFFFFF;
  --a:#1D5B87; --a-soft:#DEE9F3;
  --b:#A2500F; --b-soft:#F6E7D6;
  --good:#2C7A51; --good-soft:#DBEDE2;
  --warn:#846400; --warn-soft:#F4EACC;
  --crit:#A62B22; --crit-soft:#F6DEDA;
  --shadow:0 1px 2px rgba(20,31,29,.05), 0 6px 20px -12px rgba(20,31,29,.22);
  --shadow-up:0 -2px 20px -8px rgba(20,31,29,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1513; --surface:#151F1D; --surface-2:#1B2624; --surface-3:#22302C;
    --line:#283733; --line-strong:#3D4E49;
    --ink:#E7EEEB; --ink-2:#AEBDB8; --ink-3:#87968F;
    --accent:#4FB3A6; --accent-soft:#10332E; --on-accent:#08201D;
    --a:#6EAFDE; --a-soft:#122938;
    --b:#E09452; --b-soft:#33200E;
    --good:#5BBF8A; --good-soft:#123023;
    --warn:#D6B14A; --warn-soft:#2F2810;
    --crit:#E3776B; --crit-soft:#381915;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
    --shadow-up:0 -2px 20px -8px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1513; --surface:#151F1D; --surface-2:#1B2624; --surface-3:#22302C;
  --line:#283733; --line-strong:#3D4E49;
  --ink:#E7EEEB; --ink-2:#AEBDB8; --ink-3:#87968F;
  --accent:#4FB3A6; --accent-soft:#10332E; --on-accent:#08201D;
  --a:#6EAFDE; --a-soft:#122938;
  --b:#E09452; --b-soft:#33200E;
  --good:#5BBF8A; --good-soft:#123023;
  --warn:#D6B14A; --warn-soft:#2F2810;
  --crit:#E3776B; --crit-soft:#381915;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
  --shadow-up:0 -2px 20px -8px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:96px}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.02em;flex:none}
.who{flex:1;min-width:150px}
.who h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.who p{margin:1px 0 0;font-size:11.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.top-tags{display:flex;gap:6px;flex-wrap:wrap}

.tabs{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.tabs button{padding:11px 14px;font-size:13px;font-weight:600;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap;letter-spacing:-.005em}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .bdg{display:inline-block;margin-left:6px;background:var(--crit);color:#fff;font-size:10px;
  font-weight:700;padding:1px 5px;border-radius:8px;font-family:"IBM Plex Mono",monospace;vertical-align:1px}
:root[data-theme="dark"] .tabs .bdg{color:#2A0B08}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs .bdg{color:#2A0B08}}

main{max-width:1120px;margin:0 auto;padding:20px}

/* ---------- generic ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:2.5px 7px;border-radius:3px;white-space:nowrap}
.chip.a{background:var(--a-soft);color:var(--a)}
.chip.b{background:var(--b-soft);color:var(--b)}
.chip.r{background:var(--surface-3);color:var(--ink-2)}
.chip.k{background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.panel-h{padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:120px}
.panel-h p{margin:0;font-size:11.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.panel-b{padding:16px}
.panel-b.flush{padding:0}

.cols{display:grid;gap:16px}
@media(min-width:880px){.cols.pos{grid-template-columns:1.6fr 1fr}.cols.half{grid-template-columns:1fr 1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;
  padding:8px 14px;border-radius:6px;background:var(--accent);color:var(--on-accent);letter-spacing:-.005em}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.danger{background:var(--crit-soft);color:var(--crit);border:1px solid transparent}
.btn.ok{background:var(--good-soft);color:var(--good)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.wide{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:var(--surface-2)}
.tile b{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;font-weight:600}
.tile .v{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.tile .d{font-size:10.5px;color:var(--ink-3);margin-top:5px}
.tile.hot{background:var(--crit-soft);border-color:transparent}
.tile.hot .v,.tile.hot .d,.tile.hot b{color:var(--crit)}

table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{text-align:left;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line-strong);background:var(--surface-2);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.nm{color:var(--ink);font-weight:600;font-size:13px}
td.n{font-family:"IBM Plex Mono",monospace;text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
tr.dim td{opacity:.5}

/* ---------- POS ---------- */
.menu{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.mi{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--surface);text-align:left;
  display:flex;flex-direction:column;gap:4px;min-height:104px;position:relative;transition:border-color .12s,transform .08s}
.mi:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.mi:disabled{cursor:not-allowed;background:var(--surface-2);border-style:dashed}
.mi .nm{font-size:13.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink);line-height:1.25}
.mi:disabled .nm{color:var(--ink-3)}
.mi .pr{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600;color:var(--ink);margin-top:auto}
.mi:disabled .pr{color:var(--ink-3)}
.mi .strike{text-decoration:line-through;color:var(--ink-3);font-size:12px;margin-right:5px}
.mi .why{font-size:10.5px;color:var(--crit);line-height:1.3;font-family:"IBM Plex Mono",monospace}
.mi .sub{font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.mi .top-r{position:absolute;top:9px;right:9px}

.cart-l{display:flex;align-items:baseline;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.cart-l .q{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);flex:none;width:26px}
.cart-l .n{flex:1;color:var(--ink);font-weight:600}
.cart-l .a{font-family:"IBM Plex Mono",monospace}
.cart-l button{color:var(--crit);font-size:15px;line-height:1;padding:0 3px}
.tot{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:12.5px;padding:3px 0;color:var(--ink-2)}
.tot.big{font-size:19px;font-weight:600;color:var(--ink);border-top:1px solid var(--line-strong);margin-top:8px;padding-top:10px}
.empty{text-align:center;color:var(--ink-3);font-size:12.5px;padding:26px 10px;font-family:"IBM Plex Mono",monospace}

/* ---------- alerts / rows ---------- */
.al{display:flex;gap:9px;align-items:baseline;padding:8px 11px;border-radius:6px;font-size:12px;margin-bottom:6px;line-height:1.45}
.al .k{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;flex:none;padding-top:1px}
.al.w{background:var(--warn-soft);color:var(--warn)}
.al.c{background:var(--crit-soft);color:var(--crit)}
.al.g{background:var(--good-soft);color:var(--good)}
.al.i{background:var(--accent-soft);color:var(--accent)}

.rq{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden;background:var(--surface)}
.rq-h{display:flex;gap:10px;align-items:center;padding:10px 13px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rq-h .id{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--accent);font-weight:600}
.rq-h .rt{font-size:12.5px;color:var(--ink-2);flex:1;min-width:130px}
.rq-h .rt b{color:var(--ink)}
.rq-b{padding:12px 13px}
.rq-line{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rq-line:last-child{border-bottom:0}
.rq-line .ln{flex:1;min-width:110px;font-size:13px;font-weight:600;color:var(--ink)}
.rq-line .meta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
input[type=number]{width:66px;padding:5px 7px;border:1px solid var(--line-strong);border-radius:5px;
  background:var(--surface);color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:12.5px;text-align:right}
select{padding:6px 9px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);
  color:var(--ink);font-family:inherit;font-size:12.5px}
label.fl{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:4px}

/* ---------- ticket ---------- */
.tkt{border:1.5px dashed var(--accent);border-radius:9px;padding:13px;background:var(--accent-soft);margin-bottom:10px}
.tkt .th{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.tkt .tn{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;color:var(--accent)}
.tkt .rt{font-size:11.5px;color:var(--accent);font-family:"IBM Plex Mono",monospace}
.tkt table{font-size:12px}
.tkt td,.tkt th{border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.tkt thead th{background:transparent;color:var(--accent)}
.tkt td{color:var(--ink)}
.qr{width:52px;height:52px;flex:none;background:
  repeating-linear-gradient(90deg,var(--accent) 0 4px,transparent 4px 8px),
  repeating-linear-gradient(0deg,var(--accent) 0 4px,transparent 4px 8px);
  opacity:.55;border-radius:4px}

/* ---------- toggle ---------- */
.sw{width:38px;height:22px;border-radius:11px;background:var(--line-strong);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--good)}
.sw.on::after{transform:translateX(16px)}

/* ---------- bottom persona bar ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);box-shadow:var(--shadow-up)}
.dock-in{max-width:1120px;margin:0 auto;padding:8px 14px 10px}
.dock-lbl{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:0 4px 7px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dock-lbl em{font-style:normal;font-family:"IBM Plex Mono",monospace;text-transform:none;letter-spacing:0;font-size:10.5px;color:var(--line-strong)}
.dock-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
.pz{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 8px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);white-space:nowrap;flex:none;transition:border-color .12s,background .12s;position:relative}
.pz:hover{border-color:var(--line-strong);background:var(--surface-2)}
.pz[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pz .mono2{width:28px;height:28px;border-radius:7px;background:var(--surface-3);color:var(--ink-2);
  display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;flex:none}
.pz[aria-current="true"] .mono2{background:var(--accent);color:var(--on-accent)}
.pz .pt{text-align:left}
.pz .pt b{display:block;font-size:12.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink);line-height:1.2}
.pz .pt span{display:block;font-size:10px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;margin-top:1px}
.pz .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--crit)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;z-index:60;
  background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:12.5px;font-weight:600;
  box-shadow:0 8px 30px -10px rgba(0,0,0,.5);max-width:90vw;text-align:center;pointer-events:none}
@media(prefers-reduced-motion:no-preference){
  .toast{animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
}
.hint{font-size:12px;color:var(--ink-3);line-height:1.5;margin:0 0 14px;max-width:70ch}
.hint b{color:var(--ink-2)}
</style>

<div class="top">
  <div class="top-in">
    <div class="mark" id="mark">F3</div>
    <div class="who"><h1 id="whoName">Floor 3 &middot; Coffee Shop</h1><p id="whoRole">counter &middot; shift 2</p></div>
    <div class="top-tags" id="topTags"></div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</div>

<main id="view"></main>

<div class="dock">
  <div class="dock-in">
    <p class="dock-lbl">Switch counter <em>prototype &mdash; tap to enter, no password</em></p>
    <div class="dock-row" id="dock"></div>
  </div>
</div>

<script>
/* ============================ catalogue ============================ */
const ITEMS = {
  milk:   {n:"Milk 1L",           u:"L",   t:"RAW",    rl:40},
  beans:  {n:"Coffee beans",      u:"kg",  t:"RAW",    rl:8},
  leaf:   {n:"Tea leaf",          u:"kg",  t:"RAW",    rl:3},
  sugar:  {n:"Sugar",             u:"kg",  t:"RAW",    rl:15},
  cup:    {n:"Paper cup 150ml",   u:"nos", t:"PACK",   rl:800},
  maida:  {n:"Maida",             u:"kg",  t:"RAW",    rl:20},
  oil:    {n:"Refined oil",       u:"L",   t:"RAW",    rl:10},
  fill:   {n:"Veg filling mix",   u:"kg",  t:"RAW",    rl:5},
  butter: {n:"Butter",            u:"kg",  t:"RAW",    rl:2},
  bread:  {n:"Bread loaf",        u:"nos", t:"RAW",    rl:10},
  juice:  {n:"Real Juice 200ml",  u:"nos", t:"TRADED", rl:60, mrp:20},
  water:  {n:"Mineral water 1L",  u:"nos", t:"TRADED", rl:60, mrp:20},
  bisc:   {n:"Marie biscuit",     u:"nos", t:"TRADED", rl:30, mrp:30},
  puff:   {n:"Veg puffs",         u:"nos", t:"FG",     rl:0,  sl:12},
  sand:   {n:"Sandwich",          u:"nos", t:"FG",     rl:0,  sl:8},
  capp:   {n:"Cappuccino",        u:"nos", t:"MTO"},
  chai:   {n:"Masala tea",        u:"nos", t:"MTO"},
};
const RECIPE = {
  capp: [["milk",0.15],["beans",0.012],["sugar",0.006],["cup",1]],
  chai: [["milk",0.10],["leaf",0.008],["sugar",0.008],["cup",1]],
  puff: [["maida",0.05],["oil",0.018],["fill",0.04],["butter",0.012]],
  sand: [["bread",0.5],["butter",0.01],["fill",0.03]],
};
const COST = {milk:52,beans:640,leaf:420,sugar:46,cup:0.62,maida:42,oil:132,fill:186,butter:248,bread:38,
              juice:14.2,water:11.5,bisc:21.8};

const PRICE = {
  A:{capp:60,chai:20,puff:25,sand:45,juice:20,water:20,bisc:30},
  B:{capp:75,chai:25,puff:30,sand:55,juice:25,water:25,bisc:35},
};

const PERSONAS = {
  coffee:{mono:"F3",name:"Floor 3 · Coffee Shop",role:"counter · shift 2",kind:"outlet",list:"B",
          menu:["capp","chai","juice","water","bisc"],tabs:["Counter","Stock","Menu","Requests"]},
  rest:  {mono:"F1",name:"Floor 1 · Restaurant",role:"counter + outlet manager",kind:"outlet",list:"A",
          menu:["capp","chai","puff","sand","juice","water"],tabs:["Counter","Stock","Menu","Requests"]},
  kiosk: {mono:"GK",name:"Ground · Snack Kiosk",role:"counter · shift 1",kind:"outlet",list:"A",
          menu:["juice","water","bisc","puff"],tabs:["Counter","Stock","Menu","Requests"]},
  kitchen:{mono:"CK",name:"Central Kitchen",role:"production in-charge",kind:"kitchen",
          tabs:["Production","Stock","Requests"]},
  store: {mono:"CS",name:"Central Store",role:"store keeper",kind:"store",
          tabs:["Control","Approvals","Tickets","Stock"]},
  proc:  {mono:"PR",name:"Procurement",role:"buyer",kind:"proc",tabs:["Requirement","Receive"]},
};
const LOCNAME = id => PERSONAS[id] ? PERSONAS[id].name : id;

/* ============================ state ============================ */
const S = {
  who:"coffee", tab:{}, cart:{},
  seq:{req:913,tkt:441,bill:1187,batch:3,po:142},
  stock:{
    store:  {milk:12,beans:18.4,leaf:3.2,sugar:40,cup:2400,maida:48.5,oil:30,fill:12,butter:4,bread:20,
             juice:156,water:120,bisc:60},
    kitchen:{maida:8,oil:4,fill:3,butter:1.2,bread:6,cup:200,puff:0,sand:0},
    coffee: {milk:0,beans:1.2,leaf:0.4,sugar:2,cup:180,juice:8,water:12,bisc:6},
    rest:   {milk:14,beans:2,leaf:0.6,sugar:3,cup:220,juice:20,water:30,puff:12,sand:6},
    kiosk:  {juice:14,water:22,bisc:9,puff:8},
  },
  reserved:{}, transit:{}, overrides:{}, requests:[], tickets:[], bills:[], batches:[], toast:null, toastT:null,
};

const q  = (l,i) => (S.stock[l] && S.stock[l][i]) || 0;
const rz = (l,i) => (S.reserved[l+":"+i] || 0);
const avail = (l,i) => q(l,i) - rz(l,i);
const move = (l,i,d) => { S.stock[l] = S.stock[l]||{}; S.stock[l][i] = Math.round(((S.stock[l][i]||0)+d)*1000)/1000; };
const fmt = (v,i) => { const u = ITEMS[i].u; return u==="nos" ? String(Math.round(v)) : v.toFixed(u==="kg"||u==="L"?3:0); };
const rupee = v => "₹" + v.toFixed(2);
const toast = m => { S.toast=m; clearTimeout(S.toastT); S.toastT=setTimeout(()=>{S.toast=null;render();},2600); render(); };

/* price with MRP ceiling */
function priceOf(loc,it){
  const listed = PRICE[PERSONAS[loc].list][it];
  const cap = ITEMS[it].mrp;
  return (cap!=null && listed>cap) ? {p:cap,listed,capped:true} : {p:listed,listed,capped:false};
}

/* availability */
function availability(loc,it){
  const ov = S.overrides[loc+":"+it];
  if (ov) return {ok:false, mode:"MANUAL", why:ov};
  const T = ITEMS[it].t;
  if (T==="MTO"){
    for (const [ing,need] of RECIPE[it]){
      if (avail(loc,ing) < need) return {ok:false,mode:"RECIPE",why:ITEMS[ing].n+" "+fmt(avail(loc,ing),ing)+" "+ITEMS[ing].u};
    }
    const port = Math.min(...RECIPE[it].map(([ing,need])=>Math.floor(avail(loc,ing)/need)));
    return {ok:true,mode:"RECIPE",left:port+" portions"};
  }
  const have = avail(loc,it);
  return have>=1 ? {ok:true,mode:"STOCK",left:fmt(have,it)+" left"} : {ok:false,mode:"STOCK",why:"out of stock"};
}

/* ============================ actions ============================ */
function add(it){ const c=S.cart[S.who]=S.cart[S.who]||{}; c[it]=(c[it]||0)+1; render(); }
function less(it){ const c=S.cart[S.who]; if(!c)return; c[it]--; if(c[it]<=0) delete c[it]; render(); }

function pay(){
  const loc=S.who, c=S.cart[loc]||{}, lines=Object.keys(c);
  if(!lines.length) return;
  let total=0;
  for(const it of lines){
    const {p}=priceOf(loc,it); total += p*c[it];
    if(ITEMS[it].t==="MTO"){ for(const [ing,need] of RECIPE[it]) move(loc,ing,-need*c[it]); }
    else move(loc,it,-c[it]);
  }
  S.bills.push({id:"CF/"+(++S.seq.bill),loc,total,lines:{...c}});
  S.cart[loc]={};
  toast("Bill "+rupee(total)+" paid — stock deducted at "+LOCNAME(loc));
}

function raise(from,to,it,qty){
  const r={id:"REQ-"+(++S.seq.req),from,to,it,qty,approved:0,status:"SUBMITTED",note:""};
  S.requests.push(r);
  toast("Request "+r.id+" sent to "+LOCNAME(to));
  render();
}

function decide(id,granted){
  const r=S.requests.find(x=>x.id===id); if(!r) return;
  granted=Math.max(0,Math.min(granted, avail(r.to,r.it)));
  if(granted<=0){ r.status="REJECTED"; r.note="nothing available"; toast(r.id+" rejected — no ticket issued"); render(); return; }
  r.approved=granted;
  r.status = granted<r.qty ? "PARTIAL" : "APPROVED";
  S.reserved[r.to+":"+r.it]=(S.reserved[r.to+":"+r.it]||0)+granted;
  const t={id:"TKT-"+(++S.seq.tkt),req:r.id,from:r.to,to:r.from,it:r.it,qty:granted,status:"ISSUED"};
  S.tickets.push(t);
  r.ticket=t.id;
  if(granted<r.qty){ r.back=r.qty-granted; toast("Approved "+granted+" of "+r.qty+" — "+r.back+" back-ordered, ticket "+t.id); }
  else toast("Approved in full — ticket "+t.id+" issued");
  render();
}

function pick(id){
  const t=S.tickets.find(x=>x.id===id); if(!t||t.status!=="ISSUED") return;
  move(t.from,t.it,-t.qty);
  S.reserved[t.from+":"+t.it]-=t.qty;
  S.transit[t.id]=t.qty; t.status="TRANSIT";
  toast("Scanned at "+LOCNAME(t.from)+" — "+fmt(t.qty,t.it)+" "+ITEMS[t.it].u+" now in transit");
  render();
}
function receive(id){
  const t=S.tickets.find(x=>x.id===id); if(!t||t.status!=="TRANSIT") return;
  move(t.to,t.it,t.qty); delete S.transit[t.id]; t.status="RECEIVED";
  const r=S.requests.find(x=>x.id===t.req); if(r) r.status = r.back ? "PART CLOSED" : "CLOSED";
  toast("Received at "+LOCNAME(t.to)+" — "+ITEMS[t.it].n+" back in stock");
  render();
}

function toggleOff(loc,it){
  const k=loc+":"+it;
  if(S.overrides[k]){ delete S.overrides[k]; toast(ITEMS[it].n+" switched back on"); }
  else { S.overrides[k]="switched off by counter"; toast(ITEMS[it].n+" switched off manually"); }
  render();
}

function produce(it,plan){
  const need = RECIPE[it].map(([i,p])=>[i,p*plan]);
  const short = need.filter(([i,n])=>avail("kitchen",i)<n);
  if(short.length){ toast("Short of "+ITEMS[short[0][0]].n+" — cannot open batch"); return; }
  let cost=0;
  for(const [i,n] of need){ move("kitchen",i,-n); cost += n*(COST[i]||0); }
  const yielded=Math.max(1,Math.round(plan*0.967));
  move("kitchen",it,yielded);
  const b={id:"PRD-"+String(++S.seq.batch).padStart(2,"0"),it,plan,yielded,cost:cost*1.12,
           unit:(cost*1.12)/yielded,bb:it==="puff"?"21:30":"18:00"};
  S.batches.push(b);
  toast("Batch "+b.id+" closed — "+yielded+" "+ITEMS[it].n+" at "+rupee(b.unit)+" each");
  render();
}

function push(to,it,qty){
  if(avail("kitchen",it)<qty){ toast("Not enough "+ITEMS[it].n+" in the kitchen"); return; }
  S.reserved["kitchen:"+it]=(S.reserved["kitchen:"+it]||0)+qty;
  const t={id:"TKT-"+(++S.seq.tkt),req:"push",from:"kitchen",to,it,qty,status:"ISSUED"};
  S.tickets.push(t);
  toast("Ticket "+t.id+" issued to "+LOCNAME(to));
  render();
}

function grn(it,qty){
  move("store",it,qty);
  const woke=S.requests.filter(r=>r.it===it && (r.status==="REJECTED"||r.back));
  woke.forEach(r=>{ r.status="SUBMITTED"; r.qty=r.back||r.qty; r.back=0; r.approved=0; delete r.ticket; });
  toast("Received "+fmt(qty,it)+" "+ITEMS[it].u+" "+ITEMS[it].n +
        (woke.length? " — "+woke.length+" back-order(s) reawakened" : ""));
  render();
}

/* ============================ helpers ============================ */
const inbox = loc => S.requests.filter(r=>r.to===loc && (r.status==="SUBMITTED"));
const myReq = loc => S.requests.filter(r=>r.from===loc);
const myTkt = loc => S.tickets.filter(t=>t.to===loc && t.status!=="RECEIVED");
const outTkt= loc => S.tickets.filter(t=>t.from===loc && t.status==="ISSUED");
function badge(loc){
  if(loc==="store") return inbox("store").length + outTkt("store").length;
  if(loc==="kitchen") return inbox("kitchen").length + outTkt("kitchen").length;
  if(loc==="proc") return needList().length;
  return myTkt(loc).length + inbox(loc).length;
}
function needList(){
  return Object.keys(ITEMS).filter(i=>ITEMS[i].rl>0 && q("store",i)<ITEMS[i].rl)
    .map(i=>{ const onHand=q("store",i), need=Math.ceil((ITEMS[i].rl*1.6-onHand)*100)/100;
      return {i,onHand,need,val:need*(COST[i]||0)}; });
}
const stChip = s => ({SUBMITTED:"warn",APPROVED:"good",PARTIAL:"warn",REJECTED:"crit",CLOSED:"r","PART CLOSED":"r"}[s]||"r");
const tkChip = s => ({ISSUED:"k",TRANSIT:"warn",RECEIVED:"good"}[s]||"r");

/* ============================ views ============================ */
function vCounter(loc){
  const P=PERSONAS[loc], cart=S.cart[loc]||{}, keys=Object.keys(cart);
  let sub=0; keys.forEach(k=>sub+=priceOf(loc,k).p*cart[k]);
  const tax=Math.round(sub*0.05*100)/100;
  const menu = P.menu.map(it=>{
    const a=availability(loc,it), pr=priceOf(loc,it);
    return `<button class="mi" ${a.ok?"":"disabled"} onclick="add('${it}')">
      <span class="top-r"><span class="chip ${ITEMS[it].t==="TRADED"?"a":"b"}">${ITEMS[it].t==="TRADED"?"MRP":"made"}</span></span>
      <span class="nm">${ITEMS[it].n}</span>
      ${a.ok ? `<span class="sub">${a.left}</span>` : `<span class="why">off — ${a.why}</span>`}
      <span class="pr">${pr.capped?`<span class="strike">₹${pr.listed}</span>`:""}₹${pr.p}</span>
      ${pr.capped?`<span class="sub">capped at MRP</span>`:""}
    </button>`;}).join("");
  return `<div class="cols pos">
    <div class="panel"><div class="panel-h"><h2>Counter</h2><p>price list ${P.list}</p></div>
      <div class="panel-b"><div class="menu">${menu}</div></div></div>
    <div class="panel"><div class="panel-h"><h2>Bill</h2><p>CF/${S.seq.bill+1}</p></div>
      <div class="panel-b">
        ${keys.length?keys.map(k=>`<div class="cart-l"><span class="q">${cart[k]}×</span>
          <span class="n">${ITEMS[k].n}</span><span class="a">${rupee(priceOf(loc,k).p*cart[k])}</span>
          <button onclick="less('${k}')" aria-label="remove one">−</button></div>`).join("")
          :`<p class="empty">Tap an item to start a bill</p>`}
        ${keys.length?`<div style="margin-top:12px">
          <div class="tot"><span>Taxable</span><span>${rupee(sub-tax)}</span></div>
          <div class="tot"><span>CGST + SGST</span><span>${rupee(tax)}</span></div>
          <div class="tot big"><span>Total</span><span>${rupee(sub)}</span></div>
          <div class="btnrow" style="margin-top:14px"><button class="btn wide" onclick="pay()">Pay &amp; print</button></div>
          </div>`:""}
      </div></div></div>`;
}

  const rows=ids.map(i=>{
    const on=q(loc,i), rv=rz(loc,i), av=on-rv;
    const low = loc==="store" ? on<ITEMS[i].rl : av<1;
    const others=Object.keys(PERSONAS).filter(p=>p!==loc&&PERSONAS[p].kind!=="proc"&&avail(p,i)>0);
    return `<tr class="${av<=0?"dim":""}">
      <td class="nm">${ITEMS[i].n} <span class="chip ${ITEMS[i].t==="TRADED"?"a":ITEMS[i].t==="FG"||ITEMS[i].t==="MTO"?"b":"r"}">${ITEMS[i].t}</span></td>

      <td>${loc!=="store"&&low?`<div class="btnrow">
        <button class="btn sm" onclick="raise('${loc}','store','${i}',${Math.max(2,Math.ceil(ITEMS[i].rl/2)||20)})">Ask store</button>
        ${others.filter(o=>o!=="store").slice(0,1).map(o=>`<button class="btn sm ghost" onclick="raise('${loc}','${o}','${i}',${Math.max(2,Math.ceil((ITEMS[i].rl||10)/2))})">Ask ${PERSONAS[o].mono}</button>`).join("")}
      </div>`:""}</td></tr>`;}).join("");

}

function vMenu(loc){
  const rows=PERSONAS[loc].menu.map(it=>{
    const a=availability(loc,it), off=!!S.overrides[loc+":"+it], pr=priceOf(loc,it);
    return `<tr><td class="nm">${ITEMS[it].n}</td>

  <tbody>${rows}</tbody></table></div></div>`;

function vReq(loc){
  const mine=myReq(loc), tk=myTkt(loc), inb=inbox(loc);
  return `${inb.length?`<div class="panel" style="margin-bottom:16px"><div class="panel-h"><h2>Asked of you</h2><p>another counter needs stock you hold</p></div>
    <div class="panel-b">${inb.map(r=>reqCard(r,true)).join("")}</div></div>`:""}
    ${tk.length?`<div class="panel" style="margin-bottom:16px"><div class="panel-h"><h2>Collection tickets</h2><p>approval authorises · the scan moves the stock</p></div>

function reqCard(r,canAct){
  const av=avail(r.to,r.it);
  return `<div class="rq"><div class="rq-h"><span class="id">${r.id}</span>
    <span class="rt"><b>${LOCNAME(r.from)}</b> → ${LOCNAME(r.to)}</span>
    <span class="chip ${stChip(r.status)}">${r.status}</span></div>
    <div class="rq-b"><div class="rq-line">
      <span class="ln">${ITEMS[r.it].n}</span>
      <span class="meta">asked ${fmt(r.qty,r.it)} ${ITEMS[r.it].u}${r.approved?` · approved ${fmt(r.approved,r.it)}`:""}${r.back?` · ${fmt(r.back,r.it)} back-ordered`:""}</span>
      ${canAct?`<span class="meta">available here ${fmt(av,r.it)}</span>
        <input type="number" id="g_${r.id}" value="${Math.min(r.qty,av)}" min="0" step="0.1">
        <button class="btn sm" onclick="decide('${r.id}', parseFloat(document.getElementById('g_${r.id}').value))">Approve</button>
        <button class="btn sm danger" onclick="decide('${r.id}',0)">Reject</button>`
      :r.ticket?`<span class="chip k">${r.ticket}</span>`:""}
    </div></div></div>`;
}
function tktCard(t,loc){
  const mine=t.to===loc;
  return `<div class="tkt"><div class="th"><div><div class="tn">${t.id}</div>
    <div class="rt">${LOCNAME(t.from)} → ${LOCNAME(t.to)} · from ${t.req}</div></div>
    <div style="display:flex;gap:12px;align-items:center"><span class="chip ${tkChip(t.status)}">${t.status}</span><div class="qr"></div></div></div>
    <table><thead><tr><th>Item</th><th style="text-align:right">Approved</th><th></th></tr></thead>
    <tbody><tr><td>${ITEMS[t.it].n}</td><td class="n">${fmt(t.qty,t.it)} ${ITEMS[t.it].u}</td>
    <td style="text-align:right">${
      t.status==="ISSUED" ? `<button class="btn sm" onclick="pick('${t.id}')">Scan at ${PERSONAS[t.from].mono} — collect</button>`
      : t.status==="TRANSIT" && mine ? `<button class="btn sm ok" onclick="receive('${t.id}')">Scan here — receive</button>`
      : t.status==="TRANSIT" ? `<span class="chip warn">with the porter</span>` : ""}</td></tr></tbody></table></div>`;
}

    ${tr?`<div class="al w"><span class="k">TRANSIT</span><span>${tr} ticket(s) picked but not yet received. Stock is owned by neither location until the receiving counter scans.</span></div>`:""}
    ${need.length?`<div class="al w"><span class="k">BUY</span><span>${need.length} item(s) below reorder level — Procurement can see the computed requirement.</span></div>`:""}
    <div class="panel"><div class="panel-h"><h2>Days of cover</h2><p>available ÷ average daily use</p></div>

function vRequirement(){
  const need=needList();
  const rows=need.map(n=>`<tr><td class="nm">${ITEMS[n.i].n}</td>
    <td class="n">${fmt(n.onHand,n.i)}</td><td class="n">${ITEMS[n.i].rl}</td>
    <td class="n">${fmt(n.need,n.i)} ${ITEMS[n.i].u}</td><td class="n">${rupee(n.val)}</td>
    <td><button class="btn sm" onclick="grn('${n.i}',${n.need})">Order &amp; receive</button></td></tr>`).join("");
  const total=need.reduce((s,n)=>s+n.val,0);
  return `<p class="hint">Nobody types this list. It is computed from stock on hand against reorder level, and in the full build it also nets off open requests, the production plan exploded through recipes, and consumption velocity over the trailing period. <b>Order &amp; receive</b> shortcuts PO and goods receipt for the demo — and reawakens anything that was back-ordered on that item.</p>
  <div class="panel"><div class="panel-h"><h2>Computed requirement</h2><p>${need.length} items · ${rupee(total)}</p></div>
  <div class="panel-b flush scroll">${need.length?`<table><thead><tr><th>Item</th><th style="text-align:right">On hand</th>
  <th style="text-align:right">Reorder at</th><th style="text-align:right">Suggested</th><th style="text-align:right">Value</th><th></th></tr></thead>
  <tbody>${rows}</tbody></table>`:`<p class="empty">Everything above reorder level</p>`}</div></div>`;
}
function vReceive(){
  const opts=Object.keys(ITEMS).filter(i=>ITEMS[i].rl>0).map(i=>`<option value="${i}">${ITEMS[i].n}</option>`).join("");
  const back=S.requests.filter(r=>r.back||r.status==="REJECTED");
  return `<div class="panel"><div class="panel-h"><h2>Goods receipt</h2><p>into Central Store</p></div><div class="panel-b">
    <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
      <div><label class="fl" for="gi">Item</label><select id="gi">${opts}</select></div>
      <div><label class="fl" for="gq">Quantity</label><input type="number" id="gq" value="40" min="1" step="1"></div>
      <button class="btn" onclick="grn(document.getElementById('gi').value, parseFloat(document.getElementById('gq').value))">Post receipt</button>
    </div></div></div>
    ${back.length?`<div class="panel" style="margin-top:16px"><div class="panel-h"><h2>Waiting on a receipt</h2><p>these wake up when the item arrives</p></div>
    <div class="panel-b">${back.map(r=>`<div class="al w"><span class="k">${r.id}</span><span>${LOCNAME(r.from)} · ${ITEMS[r.it].n} · ${fmt(r.back||r.qty,r.it)} ${ITEMS[r.it].u} outstanding</span></div>`).join("")}</div></div>`:""}`;
}

/* ============================ render ============================ */
function render(){
  const loc=S.who, P=PERSONAS[loc];
  const tab=S.tab[loc]||P.tabs[0];
  document.getElementById("mark").textContent=P.mono;
  document.getElementById("whoName").textContent=P.name;
  document.getElementById("whoRole").textContent=P.role;
  document.getElementById("topTags").innerHTML =
    (P.list?`<span class="chip b">price list ${P.list}</span>`:"") +
    `<span class="chip r">${P.kind}</span>`;

  document.getElementById("tabs").innerHTML = P.tabs.map(t=>{
    let b=0;
    if(t==="Requests") b=myTkt(loc).length+inbox(loc).length;
    if(t==="Approvals") b=inbox("store").length;
    if(t==="Tickets") b=outTkt(loc).length;
    if(t==="Requirement") b=needList().length;
    return `<button role="tab" aria-selected="${t===tab}" onclick="S.tab['${loc}']='${t}';render()">${t}${b?`<span class="bdg">${b}</span>`:""}</button>`;
  }).join("");

  let html="";
  if(tab==="Counter") html=vCounter(loc);
  else if(tab==="Stock") html=vStock(loc);
  else if(tab==="Menu") html=vMenu(loc);
  else if(tab==="Requests") html=vReq(loc);
  else if(tab==="Control") html=vControl();
  else if(tab==="Approvals") html=vApprovals();
  else if(tab==="Tickets") html=vTickets(loc);
  else if(tab==="Production") html=vProduction();
  else if(tab==="Requirement") html=vRequirement();
  else if(tab==="Receive") html=vReceive();
  document.getElementById("view").innerHTML=html;

  document.getElementById("dock").innerHTML=Object.keys(PERSONAS).map(k=>{
    const p=PERSONAS[k], b=badge(k);
    return `<button class="pz" aria-current="${k===S.who}" onclick="S.who='${k}';window.scrollTo(0,0);render()">
      <span class="mono2">${p.mono}</span><span class="pt"><b>${p.name.replace(/^.*· /,"")}</b><span>${p.role.split(" ·")[0]}</span></span>
      ${b?`<span class="dot"></span>`:""}</button>`;}).join("");

  const old=document.querySelector(".toast"); if(old) old.remove();
  if(S.toast){ const d=document.createElement("div"); d.className="toast"; d.textContent=S.toast; document.body.appendChild(d); }
}
render();
</script>
