name: rch

# A single-instance deploy: one Postgres, one API, one UI, one Caddy in front doing automatic
# HTTPS. No registry - both application images build from this checkout's own Dockerfiles, the
# same ones the EKS path used, so there is exactly one Dockerfile per service across both
# deploy targets. `deploy.sh` in this directory is the one entry point that builds, migrates,
# seeds once and brings the stack up; read it before running `docker compose` by hand.
#
# Caddy reaches `api` and `ui` directly by service name on the network compose creates -
# there is no second reverse-proxy hop the way the K8s ingress → ui-nginx → api chain has, so
# `TRUST_PROXY=1` (one hop: Caddy) is correct here without change. `ui`'s own nginx still
# carries its `/api/` proxy block (the same image the EKS build uses), it is simply never asked
# to use it - Caddy's own `@api` route reaches the API container first.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rch -d rch"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published to the host: only containers on this network reach it.

  migrate:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    image: rch-api:local
    command: ["dist/cli/migrate.mjs"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment: &api_env
      DATABASE_URL: postgres://rch:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/rch
      # A container's own Postgres speaks no TLS at all; the image otherwise verifies the RDS
      # chain whenever NODE_ENV=production (config.ts's databaseSsl default), which this
      # Dockerfile always sets, so it has to be turned off explicitly here.
      DATABASE_SSL: "false"
      DB_POOL_MAX: "10"
      CORS_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set JWT_PRIVATE_KEY in .env - pnpm --filter @rch/api keys:generate}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY in .env}
      JWT_PREVIOUS_PUBLIC_KEY: ${JWT_PREVIOUS_PUBLIC_KEY:-}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: "30"
      COOKIE_SECURE: "true"
      SEED_PASSWORD: ${SEED_PASSWORD:?set SEED_PASSWORD in .env - at least 12 characters}
      RATE_LIMIT_PER_MINUTE: "300"
      LOGIN_RATE_LIMIT_PER_MINUTE: "10"
      LOGIN_RATE_LIMIT_PER_EMP_PER_MINUTE: "5"
      TRUST_PROXY: "1"
      LOG_LEVEL: info

  api:
    image: rch-api:local
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    environment: *api_env
    # The runtime image is distroless (no shell, no curl) - a HEALTHCHECK that shells out cannot
    # run inside the container. `caddy`'s reverse_proxy retries a connection refused start, and
    # `restart: unless-stopped` recovers a crash; that is the health story for this one box.

  ui:
    build: { context: ../.., dockerfile: UI/Dockerfile }
    image: rch-ui:local
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_UPSTREAM: http://api:3000

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    depends_on: [ui, api]

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
