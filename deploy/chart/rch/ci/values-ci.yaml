# Values for the throwaway `helm install`/`helm upgrade` inside kind (CI only -
# deploy/chart/rch/ci/install-test.sh). Points the chart at the in-cluster CI
# Postgres (ci/postgres.yaml) and the two images the `images` job already
# built and `kind load`ed as rch-api:ci / rch-ui:ci - no registry, no TLS, no
# ingress controller or metrics stack available in a kind cluster.
#
# JWT_PRIVATE_KEY / JWT_PUBLIC_KEY are deliberately NOT set here: they are
# generated fresh per CI run and passed with `--set-string` from job env vars
# (see install-test.sh) so a throwaway signing key never sits in a committed
# file, even one that only ever signs tokens inside a cluster that is deleted
# at the end of the job. SEED_PASSWORD is passed the same way, in the same
# array, so the value the chart carries and the value the smoke signs in with
# can never drift apart.
image:
  registry: ""
  tag: ci
api:
  replicas: 1
  hpa: { enabled: false }
  resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
  env:
    DATABASE_SSL: "false"
    COOKIE_SECURE: "false"
    NODE_OPTIONS: "--max-old-space-size=179"   # 70% of the 256Mi limit above; see values.yaml
    IMAGE_BUCKET: rch-ci-images   # kind never writes a photo; the name only has to parse
ui:
  replicas: 1
audit:
  replicas: 1
  resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 500m, memory: 256Mi } }
  env:
    DATABASE_SSL: "false"
ingress:
  enabled: false
secrets:
  create: true
  values:
    # Three roles, as in every real environment: the migrate steps connect as the superuser and
    # create rch_app and rch_audit from the users and passwords in the two runtime URLs.
    MIGRATE_DATABASE_URL: postgres://rch:rch@postgres:5432/rch
    DATABASE_URL: postgres://rch_app:ci-app-password@postgres:5432/rch
    AUDIT_DATABASE_URL: postgres://rch_audit:ci-audit-password@postgres:5432/rch
    JWT_PREVIOUS_PUBLIC_KEY: ""
serviceMonitor:
  enabled: false
