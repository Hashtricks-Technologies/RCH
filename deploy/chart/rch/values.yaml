image:
  registry: ""            # e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com
  api: rch-api
  ui: rch-ui
  tag: latest
  pullPolicy: IfNotPresent
api:
  replicas: 2
  resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
  hpa: { enabled: true, minReplicas: 2, maxReplicas: 6, cpu: 70 }
  # maxUnavailable, and only above one replica — see templates/api-pdb.yaml for why a
  # minAvailable budget is one a node drain can never satisfy.
  pdb: { maxUnavailable: 1 }
  # Off everywhere but production: a laptop or a kind cluster has one node, so spreading across
  # topology.kubernetes.io/zone would only ever find one candidate.
  topologySpread: { enabled: false, maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway }
  env:
    LOG_LEVEL: info
    CORS_ORIGIN: https://rch.example.com
    RATE_LIMIT_PER_MINUTE: "300"
    LOGIN_RATE_LIMIT_PER_MINUTE: "10"
    LOGIN_RATE_LIMIT_PER_EMP_PER_MINUTE: "5"
    DATABASE_SSL: "true"
    # Connections one pod's pool may hold. A request takes exactly one, so this is "how many
    # requests at once", not "how big is a request" — raise it with the instance, not instead of it.
    DB_POOL_MAX: "10"
    COOKIE_SECURE: "true"
    ACCESS_TOKEN_TTL: 15m
    REFRESH_TOKEN_TTL_DAYS: "30"
    # V8 sizes its old space from the machine's memory, not the cgroup's, so without a ceiling
    # the kernel OOM-kills the pod before Node ever decides a collection is due. 70% of
    # api.resources.limits.memory above (512Mi → 358), leaving the rest for the heap's own
    # overhead, buffers and the runtime. Move it whenever that limit moves.
    #
    # The migrate initContainer and the purge CronJob read this same list against their own
    # smaller limits. Both are short-lived processes nowhere near any ceiling, so the number is
    # derived from the api container's limit — the one that actually serves under memory.
    NODE_OPTIONS: "--max-old-space-size=358"
ui:
  replicas: 2
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
  pdb: { maxUnavailable: 1 }
ingress:
  enabled: true
  className: alb
  host: rch.example.com
  certificateArn: ""
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
    # 30 seconds for requests already in flight towards a deregistering pod to finish, instead of
    # the connection being cut the moment the pod leaves the target group. It sits inside the
    # pod's own 60s terminationGracePeriodSeconds; see apps/api/src/server.ts for the arithmetic.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    # /readyz, not /healthz: /healthz answers 200 for as long as the process exists, draining
    # included, so a pod that has stopped accepting still looks healthy to the load balancer.
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
secrets:
  create: false           # true: build the Secret from the values below (staging, dev)
  # SEED_PASSWORD is the password the six seeded accounts start on; apps/api/src/config.ts has no
  # default for it, so the api container will not start until it is set.
  values: { DATABASE_URL: "", JWT_PRIVATE_KEY: "", JWT_PUBLIC_KEY: "", JWT_PREVIOUS_PUBLIC_KEY: "", SEED_PASSWORD: "" }
  externalSecret:
    enabled: false        # true: sync from AWS Secrets Manager via External Secrets Operator (prod)
    storeName: aws-secrets-manager
    storeKind: ClusterSecretStore
    remoteKey: rch/prod   # JSON secret with the five keys above
serviceAccount:
  create: true
  annotations: {}         # eks.amazonaws.com/role-arn for IRSA when the pod itself reads AWS
# releaseLabel is the `release:` label kube-prometheus-stack's Prometheus selects both the
# ServiceMonitor and the PrometheusRule by; change it only if the operator was installed under
# another Helm release name. Both templates are additionally gated on the cluster actually
# serving monitoring.coreos.com/v1 — nothing here installs the operator.
serviceMonitor: { enabled: false, interval: 30s, releaseLabel: kube-prometheus-stack }
# Thresholds for the PrometheusRule (rendered only when serviceMonitor.enabled). Spec §12 sets
# the first two; the last is the link an on-call engineer follows at three in the morning.
alerts:
  errorRate: 0.01          # 5xx share of all requests, over 5 minutes
  p95Seconds: 1            # §12's ceiling; the SLO underneath it is 150ms/200ms, measured by the load check
  runbookUrl: https://github.com/Hashtricks-Technologies/RCH/blob/production/deploy/RUNBOOK.md
purge: { enabled: true, schedule: "15 2 * * *" }
