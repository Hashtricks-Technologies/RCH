# What the hospital runs. Everything here is a deliberate difference from values.yaml, which is
# sized for a laptop and a kind cluster. The placeholders marked FILL are the five facts only the
# account owner has; deploy/RUNBOOK.md §2 "First-time cluster setup" lists where each comes from.
image:
  registry: ""                      # FILL: <account>.dkr.ecr.<region>.amazonaws.com — deploy.yml passes it
api:
  replicas: 3
  # Production runs on ng-prod, the on-demand node group (deploy/eksctl/cluster.yaml), never on
  # the single spot node dev and staging share. A spot reclaim gives two minutes' notice, and the
  # PodDisruptionBudget and topology spread below are both decorative on one node anyway.
  # ng-prod carries no taint, so this label is what keeps production's pods on it.
  nodeSelector: { rch.io/tier: prod }
  # Sized against the load check (apps/api/scripts/loadcheck.mjs): one pod holds ten Postgres
  # connections (api.env.DB_POOL_MAX) and the snapshot is the heaviest read in the system —
  # though one snapshot now takes one of those ten, not forty.
  resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "2", memory: 1Gi } }
  hpa: { enabled: true, minReplicas: 3, maxReplicas: 6, cpu: 70 }
  pdb: { maxUnavailable: 1 }
  # Three replicas on one node make the PodDisruptionBudget decorative: draining that node takes
  # the whole service with it whatever the budget says.
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  env:
    LOG_LEVEL: info
    CORS_ORIGIN: https://rch.example.com          # FILL: the real hostname, no trailing slash
    RATE_LIMIT_PER_MINUTE: "300"
    LOGIN_RATE_LIMIT_PER_MINUTE: "10"
    LOGIN_RATE_LIMIT_PER_EMP_PER_MINUTE: "5"
    DATABASE_SSL: "true"
    DB_POOL_MAX: "10"                             # three replicas × 10 = 30 of the instance's connections
    COOKIE_SECURE: "true"
    ACCESS_TOKEN_TTL: 15m
    REFRESH_TOKEN_TTL_DAYS: "30"
    TRUST_PROXY: "1"                              # one hop: the ALB. More hops and the client IP is wrong.
    SSE_HEARTBEAT_MS: "25000"
    NODE_OPTIONS: "--max-old-space-size=716"      # 70% of the 1Gi limit above; see values.yaml
    SSE_RETRY_MS: "1000"
ui:
  replicas: 3
  nodeSelector: { rch.io/tier: prod }
  resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
  pdb: { maxUnavailable: 1 }
ingress:
  enabled: true
  className: alb
  host: rch.example.com                           # FILL
  certificateArn: ""                              # FILL: without it the ALB serves :80 only
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    # An hour, because a live-update stream is one request that never ends (RUNBOOK §10). Every
    # timeout on the path — this, nginx's proxy_read_timeout, the heartbeat — moves together.
    #
    # One line, not a folded `>-` block: folding joins the lines with a space, so the controller
    # read every attribute after the first as a name beginning with a space and rejected it.
    #
    # Access logging is deliberately absent rather than empty. `rch-alb-logs` is created by
    # nothing — deploy/cfn's AlbLogsBucketName parameter is what will create it — and an ALB told
    # to write to a bucket that does not exist, or one without the log-delivery bucket policy,
    # fails to provision at all. Once that parameter is filled in and the stack has made the
    # bucket, append
    # `,access_logs.s3.enabled=true,access_logs.s3.bucket=<AlbLogsBucketName output>`
    # to the line below — with no spaces, and with **no `access_logs.s3.prefix`**. The bucket
    # policy the stack writes grants exactly `AWSLogs/<account>/*` (deploy/cfn/rch-env.yaml); a
    # prefix moves every object to `<prefix>/AWSLogs/...`, which that policy does not permit, so
    # delivery stops silently — the ALB comes up, and no log ever lands.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600,deletion_protection.enabled=true
    # 30 seconds for requests already in flight towards a deregistering pod to finish. It sits
    # inside the pod's 60s terminationGracePeriodSeconds; apps/api/src/server.ts has the sums.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    # /readyz, not /healthz: /healthz answers 200 for as long as the process exists, draining
    # included, so a pod that has stopped accepting still looks healthy to the load balancer.
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/wafv2-acl-arn: ""   # optional; leave empty to skip
secrets:
  create: false
  externalSecret:
    enabled: true
    storeName: aws-secrets-manager
    storeKind: ClusterSecretStore
    remoteKey: rch/prod                           # a JSON secret with the five keys (SEED_PASSWORD included)
serviceAccount:
  create: true
  annotations: {}                                 # FILL if the pod itself reads Secrets Manager (IRSA)
serviceMonitor: { enabled: true, interval: 30s }
purge: { enabled: true, schedule: "15 2 * * *" }
alerts:
  errorRate: 0.01
  p95Seconds: 1
  runbookUrl: https://github.com/Hashtricks-Technologies/RCH/blob/production/deploy/RUNBOOK.md
