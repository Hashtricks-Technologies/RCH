{{- if .Values.ingress.enabled }}
{{- /*
Ranged, not `toYaml`d, and an empty value is skipped. `toYaml .Values.ingress.annotations` dumps
every key a values file declares, placeholders included, and an empty annotation is not the same
thing as an absent one: the AWS Load Balancer Controller reads `wafv2-acl-arn: ""` as a WAF ARN
it cannot resolve and leaves the ingress in a failed state, where the missing key falls back
cleanly to "no WAF". `| quote` because every annotation value must be a string — `ssl-redirect:
443` unquoted is a number and the API server rejects it.

certificateArn is merged into the same map rather than appended below it, so one rule covers it
too: with the FILL placeholder still empty it is simply not rendered, which is exactly what the
special case used to do by hand. deepCopy so the map we write into is ours and not .Values'.
*/ -}}
{{- $ann := deepCopy (.Values.ingress.annotations | default dict) }}
{{- if .Values.ingress.certificateArn }}
{{- $_ := set $ann "alb.ingress.kubernetes.io/certificate-arn" .Values.ingress.certificateArn }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    {{- range $k, $v := $ann }}
    {{- if $v }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { number: 3000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-ui, port: { number: 8080 } } } }
{{- end }}
