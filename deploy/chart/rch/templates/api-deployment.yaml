apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-api, labels: { {{- include "rch.labels" . | nindent 4 }}, app.kubernetes.io/component: api } }
spec:
  replicas: {{ .Values.api.replicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api } }
  template:
    metadata:
      labels: { {{- include "rch.labels" . | nindent 8 }}, app.kubernetes.io/component: api }
      # The configuration the containers actually read, hashed, so changing a value in api.env
      # rolls the pods. It used to hash templates/configmap.yaml - a ConfigMap nothing mounted
      # or referenced, because rch.envList inlines every one of those values into each
      # container's own env list - so the annotation moved when that template's rendering moved
      # and stood still when the configuration changed shape around it.
      annotations: { checksum/config: {{ toYaml .Values.api.env | sha256sum }} }
    spec:
      serviceAccountName: {{ include "rch.sa" . }}
      # Nothing in this pod reads the Kubernetes API; the ServiceAccount exists for IRSA, and
      # a token that is never used is only a credential sitting in a filesystem.
      automountServiceAccountToken: false
      # 60, because the shutdown this grants is 55 seconds long: apps/api/src/server.ts waits 30s
      # after flipping /readyz to 503 - long enough for this pod to leave the Service's Endpoints
      # (readiness probe every 5s, failureThreshold 3) and for the load-balancer controller to
      # reconcile that into the target group, and never shorter than the target group's own 30s
      # deregistration delay, which may not outlast the wait - and then gives itself a 25s drain
      # timer. At the old 30 the kubelet's SIGKILL arrived at the exact moment that timer fired,
      # so a slow request was cut rather than finished. Move any of these numbers and move the
      # others.
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      {{- with .Values.api.nodeSelector }}
      # values-prod.yaml pins production to the on-demand ng-prod node group
      # (deploy/eksctl/cluster.yaml). Unset everywhere else, which is how dev and staging
      # keep landing on the one spot node.
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.topologySpread.enabled }}
      # Three replicas that land on one node make the PodDisruptionBudget decorative: draining
      # that node takes the whole service with it whatever the PodDisruptionBudget says.
      topologySpreadConstraints:
        - maxSkew: {{ .Values.api.topologySpread.maxSkew }}
          topologyKey: {{ .Values.api.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.api.topologySpread.whenUnsatisfiable }}
          labelSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api } }
      {{- end }}
      # Migrations run as an initContainer (not a pre-upgrade hook Job) so they can never be
      # orphaned by Helm's diff of hook vs. release-tracked resources (see secret.yaml/
      # externalsecret.yaml for the same reasoning). Every pod that starts runs this; the
      # advisory lock taken in cli/migrate.ts serialises concurrent replicas so only one of
      # them actually applies pending migrations while the rest block, then no-op. A failing
      # migration keeps this initContainer from ever completing, so the pod never becomes
      # Ready and, with maxUnavailable: 0 below, `helm upgrade --wait` aborts the rollout
      # rather than replacing healthy old pods.
      initContainers:
        - name: migrate
          image: {{ include "rch.image" (dict "registry" .Values.image.registry "name" .Values.image.api "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["dist/cli/migrate.mjs"]
          env:
            {{- include "rch.envList" . | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
      containers:
        - name: api
          image: {{ include "rch.image" (dict "registry" .Values.image.registry "name" .Values.image.api "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          env:
            {{- include "rch.envList" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 3 }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 2, failureThreshold: 30 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
