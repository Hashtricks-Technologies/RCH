{{- if .Values.secrets.externalSecret.enabled }}
# Requires the External Secrets Operator (ESO) to already be installed
# cluster-wide before this chart is installed — ESO owns the ExternalSecret
# CRD and the controller that materializes the target Secret below.
#
# Deliberately a plain release resource, not a helm.sh/hook (see secret.yaml for the full
# reasoning). A pre-install,pre-upgrade hook was tried, ordered ahead of the (now-removed)
# migrate Job — but with target.creationPolicy: Owner and before-hook-creation, ESO's target
# Secret was destroyed and re-synced on every single upgrade, making every deploy depend on
# ESO/the external store being healthy at that exact moment. Migrations now run as an
# initContainer on the api Deployment instead, so nothing needs this ExternalSecret to exist
# before some other hook resource does.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rch.secretName" . }}
spec:
  refreshInterval: 1h
  secretStoreRef: { name: {{ .Values.secrets.externalSecret.storeName }}, kind: {{ .Values.secrets.externalSecret.storeKind }} }
  target: { name: {{ include "rch.secretName" . }}, creationPolicy: Owner }
  dataFrom: [{ extract: { key: {{ .Values.secrets.externalSecret.remoteKey }} } }]
{{- end }}
