{{- if .Values.secrets.externalSecret.enabled }}
# Requires the External Secrets Operator (ESO) to already be installed
# cluster-wide before this chart is installed - ESO owns the ExternalSecret
# CRD and the controller that materializes the target Secret below.
#
# Deliberately a plain release resource, not a helm.sh/hook (see secret.yaml for the full
# reasoning). A pre-install,pre-upgrade hook was tried, ordered ahead of the (now-removed)
# migrate Job - but with target.creationPolicy: Owner and before-hook-creation, ESO's target
# Secret was destroyed and re-synced on every single upgrade, making every deploy depend on
# ESO/the external store being healthy at that exact moment. Migrations now run as an
# initContainer on the api Deployment instead, so nothing needs this ExternalSecret to exist
# before some other hook resource does.
#
# `dataFrom: extract` copies EVERY key of the remote JSON into the Secret, so there is no per-key
# list to keep in step here - but the remote secret must carry all seven keys the env helpers in
# _helpers.tpl wire: DATABASE_URL (rch_app), MIGRATE_DATABASE_URL (the superuser),
# AUDIT_DATABASE_URL (rch_audit), JWT_PRIVATE_KEY, JWT_PUBLIC_KEY, JWT_PREVIOUS_PUBLIC_KEY (only
# during a rotation window; its secretKeyRef is optional) and SEED_PASSWORD. A missing
# SEED_PASSWORD keeps the api container from starting at all - config.ts has no default for it -
# and a missing MIGRATE_DATABASE_URL or AUDIT_DATABASE_URL keeps a migrate initContainer from
# finding its key, so that pod never starts either.
#
# Three more keys are optional and switch on QR ordering's online payment (RUNBOOK §19):
# RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET and RAZORPAY_WEBHOOK_SECRET. Their secretKeyRefs are
# optional, so a remote secret without any of them starts every pod as before and placing a QR
# order answers 503. Add all three to the remote JSON together: with one or two, the API refuses
# to start (config.ts), and this path has no render-time check to catch it first - the chart never
# sees the remote JSON. ESO picks them up within refreshInterval, and the api pods read them on
# their next restart (an env var is fixed at container start).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rch.secretName" . }}
spec:
  refreshInterval: 1h
  secretStoreRef: { name: {{ .Values.secrets.externalSecret.storeName }}, kind: {{ .Values.secrets.externalSecret.storeKind }} }
  target: { name: {{ include "rch.secretName" . }}, creationPolicy: Owner }
  dataFrom: [{ extract: { key: {{ .Values.secrets.externalSecret.remoteKey }} } }]
{{- end }}
