{{- if .Values.secrets.externalSecret.enabled }}
# Requires the External Secrets Operator (ESO) to already be installed
# cluster-wide before this chart is installed — ESO owns the ExternalSecret
# CRD and the controller that materializes the target Secret below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rch.secretName" . }}
  annotations:
    # Runs as a hook (not a plain release resource) and ahead of the
    # pre-install migrate Job (hook-weight "0", see migrate-job.yaml) so the
    # ExternalSecret exists — and ESO has a chance to sync the target Secret
    # — before the migrate Job's secretKeyRef needs it on a first install.
    # Without this, a plain ExternalSecret resource is only created after
    # pre-install hooks have already run, so the migrate Job would hit
    # CreateContainerConfigError and the install would abort.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: 1h
  secretStoreRef: { name: {{ .Values.secrets.externalSecret.storeName }}, kind: {{ .Values.secrets.externalSecret.storeKind }} }
  target: { name: {{ include "rch.secretName" . }}, creationPolicy: Owner }
  dataFrom: [{ extract: { key: {{ .Values.secrets.externalSecret.remoteKey }} } }]
{{- end }}
