{{- if .Values.secrets.create }}
# Deliberately a plain release resource, not a helm.sh/hook. A pre-install,pre-upgrade hook
# was tried so this Secret was guaranteed to exist before the (now-removed) migrate Job - but
# hook resources live outside Release.Manifest, so Helm's diff treated the previously-plain
# Secret from an already-installed release as gone and deleted it at the end of the first
# upgrade after the switch, and (with before-hook-creation) recreated it on every subsequent
# upgrade. Migrations now run as an initContainer on the api Deployment instead, which starts
# after this plain Secret already exists as part of the same release apply - no hook needed.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rch.secretName" . }}
type: Opaque
stringData:
{{- /*
  Six of the seven keys are required and are checked here rather than left to fail later.
  `values.yaml` declares every one of them as "" so the shape is documented, which means an
  environment that simply forgot one renders a Secret carrying an empty string - and an empty
  string is not a missing key: the api container starts, `config.ts` refuses it
  (`SEED_PASSWORD: Too small`, or a DSN that parses to nothing) and the migrate initContainer
  crash-loops. `fail` turns that into a `helm upgrade` that fails at template time, naming
  the key, before anything reaches the cluster - which matters most in production, where the
  upgrade deliberately runs without `--atomic` (RUNBOOK §3) and a failed install is left in
  `pending-install` to be cleaned up by hand.

  The keys in rch.optionalSecretKeys (_helpers.tpl) are the exceptions and may be empty.
  JWT_PREVIOUS_PUBLIC_KEY is empty until the first key rotation, and an empty value there is the
  ordinary state, so it still renders. The three RAZORPAY_* keys are left out of the Secret
  altogether while empty: their secretKeyRefs are optional, so the variables are simply unset in
  the pod and QR ordering answers 503 until they are filled (RUNBOOK §19). They go together or not
  at all: one or two of them set is refused here by name, because `config.ts` refuses a partial
  set at start-up and the pods would crash-loop.
*/}}
{{- $optional := splitList " " (include "rch.optionalSecretKeys" .) }}
{{- $rzp := list "RAZORPAY_KEY_ID" "RAZORPAY_KEY_SECRET" "RAZORPAY_WEBHOOK_SECRET" }}
{{- $rzpSet := list }}
{{- range $k := $rzp }}{{ if index $.Values.secrets.values $k }}{{ $rzpSet = append $rzpSet $k }}{{ end }}{{ end }}
{{- if and (gt (len $rzpSet) 0) (lt (len $rzpSet) 3) }}
{{- fail (printf "secrets.values sets %s but not all three Razorpay keys - set RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET and RAZORPAY_WEBHOOK_SECRET together, or none of them (the API refuses to start with a partial set; RUNBOOK §19.3)" (join ", " $rzpSet)) }}
{{- end }}
{{- range $k, $v := .Values.secrets.values }}
{{- if and (not (has $k $optional)) (not $v) }}
{{- fail (printf "secrets.values.%s is empty - the chart cannot build a Secret without it (deploy/RUNBOOK.md §2 lists the six keys dev and staging need)" $k) }}
{{- end }}
{{- if or $v (eq $k "JWT_PREVIOUS_PUBLIC_KEY") }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- end }}
