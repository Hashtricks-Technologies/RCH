{{- if .Values.secrets.create }}
# Deliberately a plain release resource, not a helm.sh/hook. A pre-install,pre-upgrade hook
# was tried so this Secret was guaranteed to exist before the (now-removed) migrate Job — but
# hook resources live outside Release.Manifest, so Helm's diff treated the previously-plain
# Secret from an already-installed release as gone and deleted it at the end of the first
# upgrade after the switch, and (with before-hook-creation) recreated it on every subsequent
# upgrade. Migrations now run as an initContainer on the api Deployment instead, which starts
# after this plain Secret already exists as part of the same release apply — no hook needed.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rch.secretName" . }}
type: Opaque
stringData:
{{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
