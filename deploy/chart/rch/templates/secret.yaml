{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rch.secretName" . }}
  annotations:
    # Runs as a hook (not a plain release resource) so it is guaranteed to
    # exist before the pre-install migrate Job (hook-weight "0", see
    # migrate-job.yaml) tries to resolve its secretKeyRef on a first install.
    # Plain (non-hook) resources are only created after pre-install hooks
    # have already run, which is too late for the migrate Job to find it.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
{{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
