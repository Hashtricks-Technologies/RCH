{{- if gt (int .Values.ui.replicas) 1 }}
{{- /* Same shape and same reasoning as api-pdb.yaml — see the comment there. The UI had no
budget at all, so a node drain could take every nginx pod at once and the site with it. */ -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ .Release.Name }}-ui }
spec: { maxUnavailable: {{ .Values.ui.pdb.maxUnavailable }}, selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: ui } } }
{{- end }}
