{{- if and .Values.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
{{- /*
  Spec §12, Operability: "Alerts (documented in deploy/RUNBOOK.md): 5xx rate > 1 % over 5 min,
  p95 latency > 1 s, readiness failing, DB connections > 80 %, RDS free storage < 20 %."

  Three of the five read metrics this API publishes and ship here, beside the code that emits
  them. The two RDS rules need CloudWatch metrics this cluster does not have — they are wired at
  the observability-stack level and stay in the runbook, which says so. `sse_listener_up` is a
  sixth, added because a pod whose LISTEN connection is down serves every request correctly and
  quietly stops delivering live updates, which no other alert here would notice.
  RchApiCrashLooping is a seventh, and the one rule that reads a metric from outside this API —
  see its own comment for why a restarting pod cannot be the thing that reports its restarts.

  Gated on serviceMonitor.enabled AND on the cluster actually serving monitoring.coreos.com/v1:
  nothing in this repo installs the Prometheus Operator, so the CRD may simply not be there, and
  a `helm upgrade --atomic` that meets an unknown kind fails and rolls the whole release back.
  The flag says "we want alerts"; the capability check says "this cluster can hold them".

  The `release` label is what kube-prometheus-stack's Prometheus selects rules by (its own
  `ruleSelector`), exactly as templates/servicemonitor.yaml is selected: without it this rule is
  applied to the cluster and then loaded by nothing, which looks identical to an alert that
  never fires.

  The `job` selector matches what templates/servicemonitor.yaml actually produces: it sets no
  spec.jobLabel, so Prometheus Operator's default target-labelling gives every scraped series a
  `job` label equal to the Service's own name, {{ .Release.Name }}-api — an exact match, not a
  regex, and the same expression deploy/RUNBOOK.md §9 already documents (`up{job="rch-api"}`).
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-api
  labels: { {{ include "rch.labels" . }}, app.kubernetes.io/component: api, release: {{ .Values.serviceMonitor.releaseLabel | default "kube-prometheus-stack" }} }
spec:
  groups:
    - name: {{ .Release.Name }}-api
      rules:
        - alert: RchApiHigh5xxRate
          expr: |
            sum(rate(http_request_duration_seconds_count{job="{{ .Release.Name }}-api",status=~"5.."}[5m]))
              / sum(rate(http_request_duration_seconds_count{job="{{ .Release.Name }}-api"}[5m])) > {{ .Values.alerts.errorRate }}
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "More than {{ .Values.alerts.errorRate }} of requests are failing"
            description: "One in {{ divf 1.0 .Values.alerts.errorRate }} requests is a 5xx over the last five minutes."
            runbook_url: "{{ .Values.alerts.runbookUrl }}#9-alerts"
        - alert: RchApiHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="{{ .Release.Name }}-api"}[5m])) by (le)) > {{ .Values.alerts.p95Seconds }}
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "p95 latency is over {{ .Values.alerts.p95Seconds }}s"
            description: "Spec §12 budgets 150ms for /snapshot and 200ms for a write; this fires an order of magnitude above that."
            runbook_url: "{{ .Values.alerts.runbookUrl }}#9-alerts"
        - alert: RchApiDown
          # Prometheus Operator discovers targets from the Service's Endpoints, which lists only
          # pods whose readiness probe passes — so a pod stuck failing /readyz leaves the target
          # set and this is what "readiness failing" looks like from outside.
          expr: up{job="{{ .Release.Name }}-api"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "An API pod is not being scraped"
            runbook_url: "{{ .Values.alerts.runbookUrl }}#3-roll-back"
        - alert: RchApiPoolSaturated
          expr: |
            max(pg_pool_waiting{job="{{ .Release.Name }}-api"}) > 0
              and max(pg_pool_idle{job="{{ .Release.Name }}-api"}) == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Requests are queueing for a database connection"
            description: "Ten connections per pod (spec §11.2). Sustained waiting means a slow query or a leaked transaction, not load."
            runbook_url: "{{ .Values.alerts.runbookUrl }}#9-alerts"
        - alert: RchApiCrashLooping
          # The one rule here that does not read a metric this API publishes, and it cannot: a pod
          # that is restarting is a pod that is not scraping. kube-state-metrics ships with the
          # same kube-prometheus-stack whose CRDs gate this whole file, so if this rule is loaded
          # the metric is there. More than one restart inside a quarter of an hour is a pod that
          # came up, failed and came up again — a bad migration, a missing secret, an OOM kill —
          # where a single restart is what an ordinary node eviction leaves behind.
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",container="api"}[15m]) > 1
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "An API pod is restarting in a loop"
            description: "Two or more restarts in fifteen minutes. `kubectl logs --previous` on the pod says why before the next restart wipes it."
            runbook_url: "{{ .Values.alerts.runbookUrl }}#3-roll-back"
        - alert: RchSseListenerDown
          # Not wired into /readyz, deliberately — see RUNBOOK §10. A pod whose listener is down
          # answers every request correctly; what it has stopped doing is delivering other pods'
          # writes to its own browsers. Five minutes, because the plugin reconnects itself.
          expr: min(sse_listener_up{job="{{ .Release.Name }}-api"}) == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "A pod's live-update stream has gone deaf"
            runbook_url: "{{ .Values.alerts.runbookUrl }}#10-server-sent-events-sse"
{{- end }}
