apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-ui, labels: { {{- include "rch.labels" . | nindent 4 }}, app.kubernetes.io/component: ui } }
spec:
  replicas: {{ .Values.ui.replicas }}
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: ui } }
  template:
    metadata: { labels: { {{- include "rch.labels" . | nindent 8 }}, app.kubernetes.io/component: ui } }
    spec:
      # fsGroup: 101 matches nginxinc/nginx-unprivileged's built-in nginx
      # user/group (uid 101, gid 101) so kubelet chowns the emptyDir
      # volumes below to a group the container can write — plain emptyDir
      # volumes default to root ownership, which a non-root, read-only-root
      # container can't write into otherwise (confirmed empirically: the
      # equivalent `docker run --read-only --tmpfs ...` without a writable
      # group/world mode on /etc/nginx/conf.d fails envsubst with "not
      # writable" and nginx ends up with no server block).
      securityContext: { runAsNonRoot: true, runAsUser: 101, fsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ui
          image: {{ include "rch.image" (dict "registry" .Values.image.registry "name" .Values.image.ui "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The upstream is the API Service's full cluster name, never the short one: nginx's `resolver`
          # directive asks CoreDNS directly and ignores /etc/resolv.conf's search domains, so a short
          # `rch-api` never resolves inside a pod and every /api request answers 502. Docker Compose's
          # embedded DNS resolves short names, which is why the image's own default is short and this
          # bug was invisible until the smoke drove a browser through the cluster.
          env: [{ name: API_UPSTREAM, value: http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local:3000 }]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          # nginx-unprivileged's envsubst entrypoint writes the rendered
          # config into /etc/nginx/conf.d, and nginx itself needs /tmp
          # (pid file + proxy/client/fastcgi/uwsgi/scgi temp paths — see
          # nginx.conf in the base image) and /var/cache/nginx writable.
          # A read-only root filesystem requires all three to be mounted
          # from writable emptyDir volumes.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: conf, emptyDir: {} }
