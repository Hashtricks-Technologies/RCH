# The public QR ordering page (/order/*): the app's headers, with a CSP that also lets Razorpay
# Standard Checkout run. checkout.js is loaded from checkout.razorpay.com (and pulls helpers from
# cdn.razorpay.com), opens its payment form in an iframe on api.razorpay.com, reports to
# lumberjack.razorpay.com and shows method logos from Razorpay's CDN. Nothing else is widened,
# and only this path gets it: every staff screen keeps security-headers.conf's policy.
include /etc/nginx/rch/headers-common.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.razorpay.com; connect-src 'self' https://*.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'self'" always;
