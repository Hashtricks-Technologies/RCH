# The app's security headers. nginx inherits `add_header` from the enclosing level ONLY when a
# level sets none of its own - so a `location` that adds even a Cache-Control silently drops every
# header set on the server. Every location in default.conf.template that sets its own add_header
# includes this file (or order-security-headers.conf) as well; the server level includes it for
# the rest. Copied into the image at /etc/nginx/rch/ by UI/Dockerfile.
include /etc/nginx/rch/headers-common.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
